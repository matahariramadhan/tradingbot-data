[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot-data"
version = "0.7.0"
description = "Reproducible BTC market-data audit and feature workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tradingbot-data = "tradingbot_data.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradingbot_data*", "scripts*"]
